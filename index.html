
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>2026 동아리 발표회 관리자</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f4f6fb;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 460px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0000000b;
    }

    h1 {
      font-size: 22px;
      line-height: 1.5;
      text-align: center;
      margin: 0 0 20px;
    }

    h2 {
      font-size: 20px;
      text-align: center;
    }

    h3 {
      font-size: 17px;
      margin: 8px 0 16px;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    select,
    input,
    button {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
    }

    select,
    input {
      border: 1px solid #d3d8e3;
      background: white;
      margin-bottom: 12px;
    }

    button {
      border: none;
      background: #3858d6;
      color: white;
      font-weight: bold;
      margin: 10px 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #e8ebf4;
      color: #333;
    }

    .small {
      font-size: 13px;
      color: #777;
      line-height: 1.6;
      text-align: center;
    }

    .message {
      margin-top: 12px;
      padding: 13px;
      background: #f4f6fb;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .message.success {
      background: #e8f8ec;
      color: #166534;
    }

    .message.error {
      background: #fff0ef;
      color: #b42318;
    }

    .countBox {
      padding: 24px;
      margin: 20px 0;
      background: #f4f6fb;
      border-radius: 14px;
      text-align: center;
    }

    .countNumber {
      font-size: 48px;
      font-weight: bold;
      color: #3858d6;
      margin: 12px 0;
    }

    .scannerBox {
      margin-top: 22px;
      padding: 16px;
      border: 1px solid #e1e5ee;
      border-radius: 14px;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
      overflow: hidden;
    }

    #reader video {
      border-radius: 10px;
    }

    .buttonRow {
      display: flex;
      gap: 10px;
    }

    .buttonRow button {
      flex: 1;
      min-width: 0;
    }

    [hidden] {
      display: none !important;
    }

    #gatewayFrame {
      display: none;
    }
  </style>
</head>

<body>

<!-- 로그인 화면 -->
<div class="card" id="loginPage">

  <h1>
    2026 대전노은고등학교<br>
    동아리 발표회
  </h1>

  <h2>부스 관리자 로그인</h2>

  <label for="club">동아리 선택</label>

  <select id="club" disabled>
    <option value="">동아리 목록 불러오는 중...</option>
  </select>

  <label for="adminCode">관리자코드 (8자리)</label>

  <input
    id="adminCode"
    type="password"
    maxlength="8"
    placeholder="8자리 관리자코드"
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false"
  >

  <button id="loginBtn" disabled>
    로그인
  </button>

  <div id="loginMessage" class="message">
    동아리 목록을 불러오는 중...
  </div>

  <p class="small">
    이메일이나 Google 로그인은 필요하지 않습니다.
  </p>

</div>


<!-- 관리자 화면 -->
<div class="card" id="managerPage" hidden>

  <h1 id="managerTitle">
    동아리 관리자
  </h1>

  <p class="small">
    관리자 인증 완료
  </p>

  <div class="countBox">

    <h3>현재 부스 인원</h3>

    <div class="countNumber">
      <span id="currentCount">-</span>명
    </div>

    <p id="countStatus" class="small">
      인원 확인 중...
    </p>

  </div>

  <button id="refreshBtn" class="secondary">
    현재 인원 새로고침
  </button>


  <!-- 동일 페이지 카메라 -->
  <div class="scannerBox">

    <h2>학생 QR 스캐너</h2>

    <p class="small">
      다른 페이지로 이동하지 않고<br>
      이 화면에서 바로 QR을 스캔합니다.
    </p>

    <div id="reader"></div>

    <div class="buttonRow">

      <button id="startBtn">
        카메라 켜기
      </button>

      <button id="stopBtn" class="secondary" disabled>
        카메라 끄기
      </button>

    </div>

    <div id="scanStatus" class="message">
      스캔 대기 중
    </div>

    <div id="studentResult" class="message" hidden>
    </div>

    <p class="small">
      현재는 학생 QR 등록 여부만 확인합니다.
      입·퇴장 인원은 변경하지 않습니다.
    </p>

  </div>

  <button id="logoutBtn" class="secondary">
    로그아웃
  </button>

</div>


<!-- Apps Script 통신용 숨겨진 프레임 -->
<iframe
  id="gatewayFrame"
  name="festivalGatewayFrame"
  title="서버 통신"
  hidden
></iframe>


<script>
  // ======================================
  // 1. 설정
  // ======================================

  const API_URL =
    "https://script.google.com/macros/s/" +
    "AKfycbzWKKP6y-6SotsccJUOiw-Ep7ybm-" +
    "MnQMQWogE8ZpdqH_eCfsmgI64qDYz8LxMfA8p9/exec";

  const el = id => document.getElementById(id);

  const CLUB_NAMES = [
    "Chem Is Try",
    "Clavis",
    "D.P.",
    "E.P.C.",
    "INNOBIZ",
    "IVECA",
    "L.I.G.",
    "Mechanic",
    "M.V.P",
    "NBRC",
    "NEBS",
    "Nurse I Am",
    "Polaris",
    "S.I.S.",
    "T.L.",
    "뉴턴",
    "디오니소스",
    "미토피아",
    "심장",
    "온본디",
    "이슈있슈",
    "인문이문",
    "일본문화탐구동아리",
    "창공",
    "축구부",
    "크레센도"
  ];

  const CLUBS = CLUB_NAMES.map((name, index) => ({
    id: "club" + String(index + 1).padStart(2, "0"),
    name
  }));

  const CLUB_MAP = new Map(
    CLUBS.map(club => [club.id, club.name])
  );

  let currentSession = null;
  let currentClubId = null;
  let refreshTimer = null;

  let scanner = null;
  let starting = false;
  let scanBusy = false;
  let lastToken = "";
  let lastScanAt = 0;

  let requestCounter = 0;
  let activeRequest = null;
  const requestQueue = [];


  // ======================================
  // 2. 서버 통신
  // ======================================

  function showMessage(id, text, type = "") {
    const target = el(id);
    target.hidden = false;
    target.textContent = text;
    target.className =
      "message" + (type ? " " + type : "");
  }

  function isAllowedGatewayOrigin(origin) {

    try {
      const url = new URL(origin);

      return (
        url.protocol === "https:" &&
        (
          url.hostname === "script.google.com" ||
          url.hostname === "script.googleusercontent.com" ||
          url.hostname.endsWith(".googleusercontent.com")
        )
      );

    } catch (error) {
      return false;
    }
  }

  function api(action, data = {}) {

    return new Promise((resolve, reject) => {

      requestQueue.push({
        action,
        data,
        resolve,
        reject
      });

      processQueue();
    });
  }

  function processQueue() {

    if (activeRequest || requestQueue.length === 0) {
      return;
    }

    const request = requestQueue.shift();

    const requestId =
      "req_" + Date.now() + "_" + (++requestCounter);

    const form = document.createElement("form");

    form.method = "POST";
    form.action = API_URL;
    form.target = "festivalGatewayFrame";
    form.style.display = "none";

    const params = {
      action: request.action,
      requestId,
      ...request.data
    };

    Object.entries(params).forEach(([key, value]) => {

      const input = document.createElement("input");

      input.type = "hidden";
      input.name = key;
      input.value = String(value ?? "");

      form.appendChild(input);
    });

    document.body.appendChild(form);

    const timeout = setTimeout(() => {

      if (!activeRequest ||
          activeRequest.requestId !== requestId) {
        return;
      }

      activeRequest = null;
      form.remove();

      request.reject(
        new Error(
          "서버 응답 시간이 초과됐습니다. " +
          "Apps Script 배포 설정과 연결 상태를 확인하세요."
        )
      );

      processQueue();

    }, 30000);

    activeRequest = {
      requestId,
      form,
      timeout,
      resolve: request.resolve,
      reject: request.reject
    };

    form.submit();
  }

  window.addEventListener("message", event => {

    if (!isAllowedGatewayOrigin(event.origin)) {
      return;
    }

    if (
      event.source !==
      el("gatewayFrame").contentWindow
    ) {
      return;
    }

    const data = event.data;

    if (
      !data ||
      data.type !== "FESTIVAL_GATEWAY_RESPONSE" ||
      !activeRequest ||
      data.requestId !== activeRequest.requestId
    ) {
      return;
    }

    const request = activeRequest;

    activeRequest = null;

    clearTimeout(request.timeout);
    request.form.remove();

    if (data.ok) {
      request.resolve(data.data);
    } else {
      request.reject(
        new Error(data.error || "서버 오류")
      );
    }

    processQueue();
  });


  // ======================================
  // 3. 동아리 목록
  // ======================================

  function populateClubs(clubs) {

    const select = el("club");

    select.innerHTML = "";

    clubs.forEach(club => {

      const option = document.createElement("option");

      option.value = club.id;
      option.textContent = club.name;

      select.appendChild(option);
    });

    select.disabled = false;
    el("loginBtn").disabled = false;
  }

  async function loadClubs() {

    try {

      const clubs = await api("clubs");

      if (!Array.isArray(clubs) || !clubs.length) {
        throw new Error("동아리 목록이 비어 있습니다.");
      }

      populateClubs(clubs);

      showMessage(
        "loginMessage",
        "동아리를 선택하고 관리자코드를 입력하세요."
      );

    } catch (error) {

      showMessage(
        "loginMessage",
        "동아리 목록 조회 실패: " + error.message,
        "error"
      );
    }
  }


  // ======================================
  // 4. 관리자 로그인
  // ======================================

  async function login() {

    const clubId = el("club").value;

    const code = el("adminCode").value
      .trim()
      .toUpperCase();

    if (!clubId || !/^[A-F0-9]{8}$/.test(code)) {

      showMessage(
        "loginMessage",
        "동아리와 8자리 관리자코드를 확인하세요.",
        "error"
      );

      return;
    }

    el("loginBtn").disabled = true;

    showMessage(
      "loginMessage",
      "관리자 인증 중..."
    );

    try {

      const result = await api("login", {
        clubId,
        code
      });

      if (!result || !result.session) {
        throw new Error("로그인 세션을 받지 못했습니다.");
      }

      currentSession = result.session;
      currentClubId = clubId;

      el("adminCode").value = "";

      el("loginPage").hidden = true;
      el("managerPage").hidden = false;

      el("managerTitle").textContent =
        (result.clubName || CLUB_MAP.get(clubId)) +
        " 관리자";

      refreshCount();

      clearInterval(refreshTimer);

      refreshTimer = setInterval(() => {

        if (currentSession && !document.hidden) {
          refreshCount();
        }

      }, 60000);

    } catch (error) {

      showMessage(
        "loginMessage",
        "로그인 실패: " + error.message,
        "error"
      );

    } finally {

      el("loginBtn").disabled = false;
    }
  }


  // ======================================
  // 5. 현재 부스 인원
  // ======================================

  async function refreshCount() {

    if (!currentSession) return;

    const session = currentSession;

    el("countStatus").textContent =
      "인원 확인 중...";

    try {

      const result = await api("count", {
        session
      });

      if (session !== currentSession) return;

      el("currentCount").textContent =
        result.currentCount ?? 0;

      el("countStatus").textContent =
        "Firebase 조회 완료";

    } catch (error) {

      if (session !== currentSession) return;

      el("countStatus").textContent =
        "조회 실패: " + error.message;
    }
  }


  // ======================================
  // 6. QR 카메라 시작
  // ======================================

  async function startScanner() {

    if (
      !currentSession ||
      scanner ||
      starting
    ) {
      return;
    }

    if (typeof Html5Qrcode === "undefined") {

      showMessage(
        "scanStatus",
        "QR 라이브러리를 불러오지 못했습니다.",
        "error"
      );

      return;
    }

    starting = true;
    el("startBtn").disabled = true;

    const instance = new Html5Qrcode("reader");
    scanner = instance;

    try {

      await instance.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: {
            width: 220,
            height: 220
          }
        },
        onScanSuccess,
        () => {}
      );

      el("stopBtn").disabled = false;

      showMessage(
        "scanStatus",
        "카메라 실행 중\n학생 QR을 비춰 주세요."
      );

    } catch (error) {

      scanner = null;

      showMessage(
        "scanStatus",
        "카메라 실행 실패: " +
        (error.message || String(error)),
        "error"
      );

      try {
        instance.clear();
      } catch (e) {
        console.error(e);
      }

    } finally {

      starting = false;
      el("startBtn").disabled = !!scanner;
    }
  }


  // ======================================
  // 7. QR 카메라 중지
  // ======================================

  async function stopScanner() {

    if (!scanner) return;

    const instance = scanner;
    scanner = null;

    el("stopBtn").disabled = true;

    try {

      if (instance.isScanning) {
        await instance.stop();
      }

      instance.clear();

    } catch (error) {
      console.error(error);
    }

    el("startBtn").disabled = false;

    showMessage(
      "scanStatus",
      "카메라 종료"
    );
  }


  // ======================================
  // 8. 학생 QR 검증
  // ======================================

  async function onScanSuccess(decodedText) {

    if (scanBusy || !currentSession) {
      return;
    }

    const token = String(decodedText || "").trim();

    const now = Date.now();

    if (
      token === lastToken &&
      now - lastScanAt < 5000
    ) {
      return;
    }

    lastToken = token;
    lastScanAt = now;

    if (!/^[A-Fa-f0-9]{64}$/.test(token)) {

      showMessage(
        "studentResult",
        "올바른 학생 QR 형식이 아닙니다.",
        "error"
      );

      return;
    }

    scanBusy = true;

    const session = currentSession;

    showMessage(
      "scanStatus",
      "학생 QR 확인 중..."
    );

    try {

      const result = await api("scan", {
        session,
        token
      });

      if (session !== currentSession) return;

      if (result.valid) {

        let statusText;

        if (!result.currentClubId) {

          statusText = "현재 미입장 상태";

        } else if (
          result.currentClubId === currentClubId
        ) {

          statusText = "현재 이 부스에 입장 중";

        } else {

          const clubName =
            CLUB_MAP.get(result.currentClubId) ||
            result.currentClubId;

          statusText =
            "현재 다른 부스 입장 중: " + clubName;
        }

        showMessage(
          "studentResult",
          "✓ 등록된 학생 QR입니다!\n" +
          statusText,
          "success"
        );

        showMessage(
          "scanStatus",
          "QR 검증 완료\n다음 학생을 스캔할 수 있습니다."
        );

      } else {

        showMessage(
          "studentResult",
          result.message || "등록되지 않은 QR입니다.",
          "error"
        );
      }

    } catch (error) {

      if (session !== currentSession) return;

      showMessage(
        "studentResult",
        "학생 확인 실패: " + error.message,
        "error"
      );

    } finally {

      scanBusy = false;
    }
  }


  // ======================================
  // 9. 로그아웃
  // ======================================

  async function logout() {

    const oldSession = currentSession;

    currentSession = null;
    currentClubId = null;

    clearInterval(refreshTimer);
    refreshTimer = null;

    await stopScanner();

    el("managerPage").hidden = true;
    el("loginPage").hidden = false;

    el("currentCount").textContent = "-";
    el("studentResult").hidden = true;

    lastToken = "";
    lastScanAt = 0;

    showMessage(
      "loginMessage",
      "로그아웃되었습니다."
    );

    if (oldSession) {

      try {
        await api("logout", {
          session: oldSession
        });
      } catch (error) {
        console.error(error);
      }
    }
  }


  // ======================================
  // 10. 버튼 연결
  // ======================================

  el("loginBtn").addEventListener(
    "click",
    login
  );

  el("refreshBtn").addEventListener(
    "click",
    refreshCount
  );

  el("startBtn").addEventListener(
    "click",
    startScanner
  );

  el("stopBtn").addEventListener(
    "click",
    stopScanner
  );

  el("logoutBtn").addEventListener(
    "click",
    logout
  );

  el("adminCode").addEventListener(
    "input",
    () => {

      const input = el("adminCode");

      input.value = input.value
        .toUpperCase()
        .replace(/[^A-F0-9]/g, "")
        .slice(0, 8);
    }
  );

  el("adminCode").addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        login();
      }
    }
  );


  // ======================================
  // 11. 실행
  // ======================================

  loadClubs();

</script>

</body>
</html>
