
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 동아리 발표회 관리자</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #f4f6fb;
  font-family: Arial, sans-serif;
  color: #222;
}

.card {
  max-width: 460px;
  margin: 20px auto;
  padding: 22px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 20px #0000000b;
}

h1 {
  text-align: center;
  font-size: 22px;
  line-height: 1.5;
}

h2 {
  text-align: center;
  font-size: 19px;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
}

input,
select {
  border: 1px solid #ccd2de;
  background: white;
}

button {
  border: 0;
  background: #3858d6;
  color: white;
  font-weight: bold;
  margin: 10px 0;
}

button:disabled {
  opacity: 0.5;
}

.secondary {
  background: #e8ebf4;
  color: #333;
}

.small {
  text-align: center;
  font-size: 13px;
  color: #777;
  line-height: 1.6;
}

.countBox {
  background: #f4f6fb;
  border-radius: 14px;
  padding: 22px;
  text-align: center;
  margin: 20px 0;
}

.count {
  font-size: 48px;
  color: #3858d6;
  font-weight: bold;
  margin: 10px;
}

.scannerBox {
  border: 1px solid #e2e6f0;
  border-radius: 14px;
  padding: 16px;
  margin-top: 20px;
}

#reader {
  width: 100%;
  margin: 12px auto;
}

.buttons {
  display: flex;
  gap: 8px;
}

.buttons button {
  flex: 1;
  min-width: 0;
}

.message {
  background: #f4f6fb;
  border-radius: 10px;
  padding: 13px;
  margin: 12px 0;
  white-space: pre-line;
  overflow-wrap: anywhere;
  line-height: 1.6;
  font-size: 14px;
}

.success {
  background: #e9f8ed;
  color: #166534;
}

.error {
  background: #fef0ef;
  color: #b42318;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<!-- 관리자 로그인 -->
<div class="card" id="loginPage">

  <h1>
    2026 대전노은고등학교<br>
    동아리 발표회
  </h1>

  <h2>부스 관리자 로그인</h2>

  <label for="club">동아리 선택</label>
  <select id="club"></select>

  <label for="code">관리자코드 (8자리)</label>

  <input
    id="code"
    type="password"
    maxlength="8"
    placeholder="8자리 관리자코드"
    autocomplete="off"
  >

  <button id="loginBtn">
    로그인
  </button>

  <div id="loginMessage" class="message">
    관리자코드를 입력하세요.
  </div>

  <p class="small">
    이메일 로그인은 필요하지 않습니다.
  </p>

</div>


<!-- 관리자 화면 -->
<div class="card" id="managerPage" hidden>

  <h1 id="managerTitle">
    동아리 관리자
  </h1>

  <div class="countBox">

    <h3>현재 부스 인원</h3>

    <div class="count">
      <span id="currentCount">-</span>명
    </div>

    <p id="countStatus" class="small">
      인원 확인 대기
    </p>

  </div>

  <button id="refreshBtn" class="secondary">
    인원 새로고침
  </button>


  <!-- 같은 화면에서 QR 스캔 -->
  <div class="scannerBox">

    <h2>학생 QR 스캐너</h2>

    <p class="small">
      이 페이지에서 바로 카메라를 실행합니다.
    </p>

    <div id="reader"></div>

    <div class="buttons">

      <button id="startBtn">
        카메라 켜기
      </button>

      <button
        id="stopBtn"
        class="secondary"
        disabled
      >
        카메라 끄기
      </button>

    </div>

    <div id="scanStatus" class="message">
      스캔 대기 중
    </div>

    <div
      id="studentResult"
      class="message"
      hidden
    ></div>

    <p class="small">
      현재는 학생 등록 여부만 확인하며
      입·퇴장 인원은 변경하지 않습니다.
    </p>

  </div>

  <button id="logoutBtn" class="secondary">
    로그아웃
  </button>

</div>


<!-- Apps Script 통신용 프레임 -->
<iframe
  id="gatewayFrame"
  name="festivalGatewayFrame"
  style="display:none"
  title="서버 통신"
></iframe>


<script>

// ========================================
// 1. 기본 설정
// ========================================

const API_URL =
  "https://script.google.com/macros/s/" +
  "AKfycbzWKKP6y-6SotsccJUOiw-Ep7ybm-" +
  "MnQMQWogE8ZpdqH_eCfsmgI64qDYz8LxMfA8p9/exec";

const $ = id => document.getElementById(id);


// ========================================
// 2. 동아리 26개
// ========================================

const names = [
  "Chem Is Try",
  "Clavis",
  "D.P.",
  "E.P.C.",
  "INNOBIZ",
  "IVECA",
  "L.I.G.",
  "Mechanic",
  "M.V.P",
  "NBRC",
  "NEBS",
  "Nurse I Am",
  "Polaris",
  "S.I.S.",
  "T.L.",
  "뉴턴",
  "디오니소스",
  "미토피아",
  "심장",
  "온본디",
  "이슈있슈",
  "인문이문",
  "일본문화탐구동아리",
  "창공",
  "축구부",
  "크레센도"
];

const clubs = names.map((name, i) => ({
  id: "club" + String(i + 1).padStart(2, "0"),
  name
}));

const clubMap = new Map(
  clubs.map(c => [c.id, c.name])
);


// 동아리 목록 즉시 표시
clubs.forEach(c => {

  const option = document.createElement("option");

  option.value = c.id;
  option.textContent = c.name;

  $("club").appendChild(option);
});


// ========================================
// 3. 상태 변수
// ========================================

let session = null;
let clubId = null;

let scanner = null;
let starting = false;
let busy = false;

let timer = null;

let lastToken = "";
let lastAt = 0;

const queue = [];
let pending = null;


// ========================================
// 4. 메시지 표시
// ========================================

function message(id, text, type = "") {

  const e = $(id);

  e.hidden = false;
  e.textContent = text;

  e.className =
    "message" + (type ? " " + type : "");
}


// ========================================
// 5. Apps Script 요청
// ========================================

function api(action, data = {}) {

  return new Promise((resolve, reject) => {

    queue.push({
      action,
      data,
      resolve,
      reject
    });

    nextRequest();
  });
}


// ========================================
// 6. 요청 큐 처리
// ========================================

function nextRequest() {

  if (pending || !queue.length) {
    return;
  }

  const job = queue.shift();

  const requestId =
    "r" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2);

  const form = document.createElement("form");

  form.method = "POST";
  form.action = API_URL;
  form.target = "festivalGatewayFrame";
  form.style.display = "none";

  // 수정 완료된 부분
  const params = {
    action: job.action,
    requestId,
    ...job.data
  };

  Object.entries(params).forEach(([key, value]) => {

    const input = document.createElement("input");

    input.type = "hidden";
    input.name = key;
    input.value = String(value ?? "");

    form.appendChild(input);
  });

  document.body.appendChild(form);

  const timeout = setTimeout(() => {

    if (!pending || pending.id !== requestId) {
      return;
    }

    pending = null;
    form.remove();

    job.reject(
      new Error(
        "서버 응답을 받지 못했습니다. " +
        "Apps Script 통신을 확인하세요."
      )
    );

    nextRequest();

  }, 20000);

  pending = {
    id: requestId,
    job,
    form,
    timeout
  };

  form.submit();
}


// ========================================
// 7. Apps Script 응답 수신
// ========================================

window.addEventListener("message", event => {

  let host;

  try {
    host = new URL(event.origin).hostname;
  } catch (e) {
    return;
  }

  if (!(
    host === "script.google.com" ||
    host === "script.googleusercontent.com" ||
    host.endsWith(".googleusercontent.com")
  )) {
    return;
  }

  const data = event.data;

  if (
    !pending ||
    !data ||
    data.type !== "FESTIVAL_GATEWAY_RESPONSE" ||
    data.requestId !== pending.id
  ) {
    return;
  }

  const current = pending;
  pending = null;

  clearTimeout(current.timeout);
  current.form.remove();

  if (data.ok) {

    current.job.resolve(data.data);

  } else {

    current.job.reject(
      new Error(data.error || "서버 오류")
    );
  }

  nextRequest();
});


// ========================================
// 8. 관리자코드 입력
// ========================================

$("code").addEventListener("input", () => {

  $("code").value = $("code").value
    .toUpperCase()
    .replace(/[^A-F0-9]/g, "")
    .slice(0, 8);
});


// ========================================
// 9. 관리자 로그인
// ========================================

async function login() {

  const selected = $("club").value;

  const code = $("code").value
    .trim()
    .toUpperCase();

  if (!/^[A-F0-9]{8}$/.test(code)) {

    message(
      "loginMessage",
      "8자리 관리자코드를 입력하세요.",
      "error"
    );

    return;
  }

  $("loginBtn").disabled = true;

  message(
    "loginMessage",
    "로그인 확인 중..."
  );

  try {

    const result = await api("login", {
      clubId: selected,
      code
    });

    if (!result || !result.session) {

      throw new Error(
        "로그인 세션이 없습니다."
      );
    }

    session = result.session;
    clubId = selected;

    $("code").value = "";

    $("loginPage").hidden = true;
    $("managerPage").hidden = false;

    $("managerTitle").textContent =
      (result.clubName || clubMap.get(selected)) +
      " 관리자";

    refreshCount();

    clearInterval(timer);

    timer = setInterval(() => {

      if (session && !document.hidden) {
        refreshCount();
      }

    }, 60000);

  } catch (e) {

    message(
      "loginMessage",
      "로그인 실패: " + e.message,
      "error"
    );

  } finally {

    $("loginBtn").disabled = false;
  }
}


// ========================================
// 10. 현재 부스 인원 조회
// ========================================

async function refreshCount() {

  if (!session) {
    return;
  }

  const current = session;

  $("countStatus").textContent =
    "인원 조회 중...";

  try {

    const result = await api("count", {
      session: current
    });

    if (current !== session) {
      return;
    }

    $("currentCount").textContent =
      result.currentCount ?? 0;

    $("countStatus").textContent =
      "Firebase 조회 완료";

  } catch (e) {

    if (current !== session) {
      return;
    }

    $("countStatus").textContent =
      "조회 실패: " + e.message;
  }
}


// ========================================
// 11. 카메라 시작
// ========================================

async function startScanner() {

  if (
    scanner ||
    starting ||
    !session
  ) {
    return;
  }

  if (typeof Html5Qrcode === "undefined") {

    message(
      "scanStatus",
      "카메라 라이브러리 로딩 실패",
      "error"
    );

    return;
  }

  starting = true;
  $("startBtn").disabled = true;

  const instance = new Html5Qrcode("reader");

  scanner = instance;

  try {

    await instance.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: {
          width: 220,
          height: 220
        }
      },
      scanSuccess,
      () => {}
    );

    $("stopBtn").disabled = false;

    message(
      "scanStatus",
      "카메라 실행 중!\n학생 QR을 비춰 주세요."
    );

  } catch (e) {

    scanner = null;

    message(
      "scanStatus",
      "카메라 오류: " + e.message,
      "error"
    );

    try {
      instance.clear();
    } catch (_) {}

  } finally {

    starting = false;
    $("startBtn").disabled = !!scanner;
  }
}


// ========================================
// 12. 카메라 종료
// ========================================

async function stopScanner() {

  if (!scanner) {
    return;
  }

  const instance = scanner;
  scanner = null;

  try {

    if (instance.isScanning) {
      await instance.stop();
    }

    instance.clear();

  } catch (e) {
    console.error(e);
  }

  $("startBtn").disabled = false;
  $("stopBtn").disabled = true;

  message(
    "scanStatus",
    "카메라 종료"
  );
}


// ========================================
// 13. 학생 QR 스캔
// ========================================

async function scanSuccess(text) {

  if (busy || !session) {
    return;
  }

  const token = String(text || "").trim();
  const now = Date.now();

  if (
    token === lastToken &&
    now - lastAt < 5000
  ) {
    return;
  }

  lastToken = token;
  lastAt = now;

  if (!/^[A-Fa-f0-9]{64}$/.test(token)) {

    message(
      "studentResult",
      "올바른 학생 QR이 아닙니다.",
      "error"
    );

    return;
  }

  busy = true;

  const current = session;

  message(
    "scanStatus",
    "학생 확인 중..."
  );

  try {

    const result = await api("scan", {
      session: current,
      token
    });

    if (current !== session) {
      return;
    }

    if (result.valid) {

      const currentClub =
        result.currentClubId || "";

      let status;

      if (!currentClub) {

        status = "현재 미입장";

      } else if (currentClub === clubId) {

        status = "현재 이 부스 입장 중";

      } else {

        status =
          "다른 부스 입장 중: " +
          (
            clubMap.get(currentClub) ||
            currentClub
          );
      }

      message(
        "studentResult",
        "✓ 등록된 학생 QR입니다!\n" + status,
        "success"
      );

    } else {

      message(
        "studentResult",
        result.message ||
          "등록되지 않은 QR입니다.",
        "error"
      );
    }

    message(
      "scanStatus",
      "확인 완료 · 다음 QR 스캔 가능"
    );

  } catch (e) {

    if (current === session) {

      message(
        "studentResult",
        "검증 실패: " + e.message,
        "error"
      );
    }

  } finally {

    busy = false;
  }
}


// ========================================
// 14. 로그아웃
// ========================================

async function logout() {

  const old = session;

  session = null;
  clubId = null;

  clearInterval(timer);

  await stopScanner();

  $("managerPage").hidden = true;
  $("loginPage").hidden = false;

  $("studentResult").hidden = true;
  $("currentCount").textContent = "-";

  lastToken = "";
  lastAt = 0;

  message(
    "loginMessage",
    "로그아웃되었습니다."
  );

  if (old) {

    try {

      await api("logout", {
        session: old
      });

    } catch (e) {
      console.error(e);
    }
  }
}


// ========================================
// 15. 버튼 연결
// ========================================

$("loginBtn").addEventListener(
  "click",
  login
);

$("refreshBtn").addEventListener(
  "click",
  refreshCount
);

$("startBtn").addEventListener(
  "click",
  startScanner
);

$("stopBtn").addEventListener(
  "click",
  stopScanner
);

$("logoutBtn").addEventListener(
  "click",
  logout
);

$("code").addEventListener(
  "keydown",
  e => {

    if (e.key === "Enter") {
      login();
    }
  }
);

</script>
</body>
</html>
