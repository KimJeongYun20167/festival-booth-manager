
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 동아리 발표회 관리자</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f4f6fb;font-family:system-ui,-apple-system,sans-serif;color:#1f2937}
.card{max-width:460px;margin:20px auto;padding:23px;background:#fff;border-radius:18px;box-shadow:0 4px 20px #0000000b}
h1{text-align:center;font-size:22px;line-height:1.5}
h2{text-align:center;font-size:19px}
label{display:block;margin:18px 0 7px;font-weight:700}
input,select,button{width:100%;padding:14px;font-size:16px;border-radius:11px}
input,select{border:1px solid #ccd2de;background:white}
button{border:0;background:#3858d6;color:#fff;font-weight:700;margin:10px 0}
button:disabled{opacity:.5}
.secondary{background:#e8ebf4;color:#333}
.small{text-align:center;font-size:13px;color:#64748b;line-height:1.6}
.countBox{background:#f4f6fb;border-radius:14px;padding:22px;text-align:center;margin:20px 0}
.count{font-size:48px;color:#3858d6;font-weight:700;margin:10px}
.scannerBox{border:1px solid #e2e6f0;border-radius:14px;padding:16px;margin-top:20px}
#reader{width:100%;margin:12px auto}
.buttons{display:flex;gap:8px}
.buttons button{flex:1;min-width:0}
.message{background:#f4f6fb;border-radius:10px;padding:13px;margin:12px 0;white-space:pre-line;overflow-wrap:anywhere;line-height:1.6;font-size:14px}
.success{background:#e9f8ed;color:#166534}
.error{background:#fef0ef;color:#b42318}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{background:#e8ebf4;color:#334155;margin:0}
.mode.active{background:#3858d6;color:#fff}
[hidden]{display:none!important}
</style>
</head>

<body>

<div class="card" id="loginPage">
  <h1>2026 대전노은고등학교<br>동아리 발표회</h1>
  <h2>부스 관리자 로그인</h2>

  <label for="club">동아리 선택</label>
  <select id="club"></select>

  <label for="code">관리자코드 (8자리)</label>
  <input
    id="code"
    type="password"
    maxlength="8"
    placeholder="8자리 관리자코드"
    autocomplete="off"
  >

  <button id="loginBtn">로그인</button>
  <div id="loginMessage" class="message">
    관리자코드를 입력하세요.
  </div>
</div>

<div class="card" id="managerPage" hidden>

  <h1 id="managerTitle">동아리 관리자</h1>

  <div class="countBox">
    <h3>현재 부스 인원</h3>
    <div class="count">
      <span id="currentCount">-</span>명
    </div>
    <p id="countStatus" class="small">
      인원 확인 대기
    </p>
  </div>

  <button id="refreshBtn" class="secondary">
    인원 새로고침
  </button>

  <div class="scannerBox">
    <h2>학생 QR 스캐너</h2>
    <p class="small">현재 처리할 작업을 선택하세요.</p>

    <div class="modes">
      <button id="enterModeBtn" class="mode active">
        입장 (+1)
      </button>
      <button id="exitModeBtn" class="mode">
        퇴장 (-1)
      </button>
    </div>

    <div id="reader"></div>

    <div class="buttons">
      <button id="startBtn">카메라 켜기</button>
      <button id="stopBtn" class="secondary" disabled>
        카메라 끄기
      </button>
    </div>

    <div id="scanStatus" class="message">
      입장 모드 · 스캔 대기 중
    </div>

    <div id="studentResult" class="message" hidden></div>

    <p class="small">
      QR을 스캔하면 학생 상태와 부스 인원을
      함께 갱신합니다. 중복 입장·퇴장은
      인원을 변경하지 않습니다.
    </p>
  </div>

  <button id="logoutBtn" class="secondary">
    로그아웃
  </button>
</div>

<iframe
  id="gatewayFrame"
  name="festivalGatewayFrame"
  hidden
  title="서버 통신"
></iframe>

<script>
const API_URL =
  'https://script.google.com/macros/s/' +
  'AKfycbzWKKP6y-6SotsccJUOiw-Ep7ybm-' +
  'MnQMQWogE8ZpdqH_eCfsmgI64qDYz8LxMfA8p9/exec';

const $ = id => document.getElementById(id);

const names = [
  'Chem Is Try','Clavis','D.P.','E.P.C.',
  'INNOBIZ','IVECA','L.I.G.','Mechanic',
  'M.V.P','NBRC','NEBS','Nurse I Am',
  'Polaris','S.I.S.','T.L.','뉴턴',
  '디오니소스','미토피아','심장',
  '온본디','이슈있슈','인문이문',
  '일본문화탐구동아리','창공','축구부',
  '크레센도'
];

const clubs = names.map((name,i) => ({
  id: 'club' + String(i+1).padStart(2,'0'),
  name
}));

const clubMap = new Map(
  clubs.map(c => [c.id,c.name])
);

clubs.forEach(c => {
  const option = document.createElement('option');
  option.value = c.id;
  option.textContent = c.name;
  $('club').appendChild(option);
});

let session = null;
let clubId = null;
let scanner = null;
let starting = false;
let busy = false;
let timer = null;
let mode = 'enter';
let lastToken = '';
let lastAt = 0;

const queue = [];
let pending = null;

function message(id,text,type='') {
  const e = $(id);
  e.hidden = false;
  e.textContent = text;
  e.className = 'message' + (type ? ' '+type : '');
}

function api(action,data={}) {
  return new Promise((resolve,reject) => {
    queue.push({action,data,resolve,reject});
    nextRequest();
  });
}

function nextRequest() {
  if (pending || !queue.length) return;

  const job = queue.shift();
  const requestId = crypto.randomUUID();

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = API_URL;
  form.target = 'festivalGatewayFrame';
  form.hidden = true;

  const params = {
    action: job.action,
    requestId,
    ...job.data
  };

  Object.entries(params).forEach(([key,value]) => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = String(value ?? '');
    form.appendChild(input);
  });

  document.body.appendChild(form);

  const timeout = setTimeout(() => {
    if (!pending || pending.id !== requestId) return;

    pending = null;
    form.remove();

    job.reject(new Error(
      '서버 응답이 없습니다. Apps Script 배포를 확인하세요.'
    ));

    nextRequest();
  },20000);

  pending = {
    id: requestId,
    job,
    form,
    timeout
  };

  form.submit();
}

window.addEventListener('message',event => {
  let host;

  try {
    host = new URL(event.origin).hostname;
  } catch (_) {
    return;
  }

  if (!(
    host === 'script.google.com' ||
    host === 'script.googleusercontent.com' ||
    host.endsWith('.googleusercontent.com')
  )) return;

  const data = event.data;

  if (
    !pending ||
    !data ||
    data.type !== 'FESTIVAL_GATEWAY_RESPONSE' ||
    data.requestId !== pending.id
  ) return;

  const current = pending;
  pending = null;

  clearTimeout(current.timeout);
  current.form.remove();

  if (data.ok) {
    current.job.resolve(data.data);
  } else {
    current.job.reject(
      new Error(data.error || '서버 오류')
    );
  }

  nextRequest();
});

$('code').addEventListener('input',() => {
  $('code').value = $('code').value
    .toUpperCase()
    .replace(/[^0-9A-F]/g,'')
    .slice(0,8);
});

async function login() {
  const selected = $('club').value;

  const code = $('code').value
    .trim()
    .toUpperCase();

  if (!/^[0-9A-F]{8}$/.test(code)) {
    message(
      'loginMessage',
      '관리자코드 8자리를 입력하세요.',
      'error'
    );
    return;
  }

  $('loginBtn').disabled = true;
  message('loginMessage','로그인 확인 중...');

  try {
    const result = await api('login',{
      clubId:selected,
      code
    });

    if (!result || !result.session) {
      throw new Error(
        '관리자 세션을 받지 못했습니다.'
      );
    }

    session = result.session;
    clubId = selected;

    $('code').value = '';
    $('loginPage').hidden = true;
    $('managerPage').hidden = false;

    $('managerTitle').textContent =
      (result.clubName || clubMap.get(selected)) +
      ' 관리자';

    await refreshCount();

    clearInterval(timer);

    timer = setInterval(() => {
      if (session && !document.hidden && !busy) {
        refreshCount();
      }
    },60000);

  } catch (e) {
    message(
      'loginMessage',
      '로그인 실패: '+e.message,
      'error'
    );
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function refreshCount() {
  if (!session) return;

  const current = session;
  $('countStatus').textContent = '인원 조회 중...';

  try {
    const result = await api('count',{
      session:current
    });

    if (current !== session) return;

    $('currentCount').textContent =
      result.currentCount ?? 0;

    $('countStatus').textContent =
      'Firebase 조회 완료';

  } catch (e) {
    if (current === session) {
      $('countStatus').textContent =
        '조회 실패: '+e.message;
    }
  }
}

async function setMode(next) {
  if (busy || starting) return;

  // 입장·퇴장 모드 전환 시 카메라를
  // 종료해 실수로 반대 처리가 되지 않게 함
  if (scanner) {
    await stopScanner();
  }

  mode = next;
  lastToken = '';
  lastAt = 0;

  $('enterModeBtn').classList.toggle(
    'active',
    next === 'enter'
  );

  $('exitModeBtn').classList.toggle(
    'active',
    next === 'exit'
  );

  message(
    'scanStatus',
    (next === 'enter' ? '입장' : '퇴장') +
    ' 모드 · QR을 비춰 주세요.'
  );

  $('studentResult').hidden = true;
}

async function startScanner() {
  if (scanner || starting || !session) return;

  if (typeof Html5Qrcode === 'undefined') {
    message(
      'scanStatus',
      '카메라 라이브러리 로딩 실패',
      'error'
    );
    return;
  }

  starting = true;
  $('startBtn').disabled = true;

  const instance = new Html5Qrcode('reader');
  scanner = instance;

  try {
    await instance.start(
      { facingMode:'environment' },
      {
        fps:10,
        qrbox:{
          width:220,
          height:220
        }
      },
      scanSuccess,
      () => {}
    );

    $('stopBtn').disabled = false;

    message(
      'scanStatus',
      (mode === 'enter' ? '입장' : '퇴장') +
      ' 모드 · 카메라 실행 중'
    );

  } catch (e) {
    scanner = null;

    message(
      'scanStatus',
      '카메라 오류: '+e.message,
      'error'
    );

    try {
      instance.clear();
    } catch (_) {}

  } finally {
    starting = false;
    $('startBtn').disabled = !!scanner;
  }
}

async function stopScanner() {
  if (!scanner) return;

  const instance = scanner;
  scanner = null;

  try {
    if (instance.isScanning) {
      await instance.stop();
    }
    instance.clear();
  } catch (e) {
    console.error(e);
  }

  $('startBtn').disabled = false;
  $('stopBtn').disabled = true;

  message('scanStatus','카메라 종료');
}

async function scanSuccess(value) {
  if (busy || !session) return;

  const token = String(value || '')
    .trim()
    .toLowerCase();

  const now = Date.now();

  if (
    token === lastToken &&
    now-lastAt < 5000
  ) return;

  lastToken = token;
  lastAt = now;

  if (!/^[0-9a-f]{64}$/.test(token)) {
    message(
      'studentResult',
      '올바른 학생 QR이 아닙니다.',
      'error'
    );
    return;
  }

  busy = true;

  const current = session;
  const requestedMode = mode;

  $('enterModeBtn').disabled = true;
  $('exitModeBtn').disabled = true;

  message(
    'scanStatus',
    (requestedMode === 'enter' ? '입장' : '퇴장') +
    ' 처리 중...'
  );

  try {
    const result = await api('attendance',{
      session:current,
      token,
      mode:requestedMode
    });

    if (current !== session) return;

    if (
      result.currentCount !== null &&
      result.currentCount !== undefined
    ) {
      $('currentCount').textContent =
        result.currentCount;

      $('countStatus').textContent =
        '처리 완료';
    }

    const other =
      result.previousClubId ||
      result.currentClubId ||
      '';

    const lines = {
      entered:
        '입장 완료 (+1명)',

      exited:
        '퇴장 완료 (-1명)',

      transferred:
        '다른 부스에서 이동 완료 (+1명)',

      already_inside:
        '이미 이 부스에 입장한 학생입니다. ' +
        '(인원 변경 없음)',

      not_inside:
        other
          ? '이 부스에 입장 중이 아닙니다. ' +
            '현재 부스: ' +
            (clubMap.get(other) || other)

          : '이 부스에 입장 중이 아닙니다. ' +
            '(인원 변경 없음)'
    };

    const text = lines[result.action] ||
      '처리 결과를 확인하지 못했습니다.';

    message(
      'studentResult',
      text,
      result.changed
        ? 'success'
        : (
            result.action === 'already_inside'
              ? ''
              : 'error'
          )
    );

    message(
      'scanStatus',
      '처리 완료 · 다음 QR 스캔 가능'
    );

  } catch (e) {
    lastToken = '';
    lastAt = 0;

    if (current === session) {
      message(
        'studentResult',
        '처리 실패: '+e.message,
        'error'
      );

      message(
        'scanStatus',
        '실패 · 다시 스캔할 수 있습니다'
      );
    }
  } finally {
    busy = false;
    $('enterModeBtn').disabled = false;
    $('exitModeBtn').disabled = false;
  }
}

async function logout() {
  const old = session;

  session = null;
  clubId = null;

  clearInterval(timer);

  await stopScanner();

  $('managerPage').hidden = true;
  $('loginPage').hidden = false;
  $('studentResult').hidden = true;
  $('currentCount').textContent = '-';

  lastToken = '';
  lastAt = 0;

  setMode('enter');

  message(
    'loginMessage',
    '로그아웃되었습니다.'
  );

  if (old) {
    try {
      await api('logout',{
        session:old
      });
    } catch (e) {
      console.error(e);
    }
  }
}

$('loginBtn').addEventListener('click',login);

$('refreshBtn').addEventListener(
  'click',
  refreshCount
);

$('enterModeBtn').addEventListener(
  'click',
  () => setMode('enter')
);

$('exitModeBtn').addEventListener(
  'click',
  () => setMode('exit')
);

$('startBtn').addEventListener(
  'click',
  startScanner
);

$('stopBtn').addEventListener(
  'click',
  stopScanner
);

$('logoutBtn').addEventListener(
  'click',
  logout
);

$('code').addEventListener('keydown',e => {
  if (e.key === 'Enter') {
    login();
  }
});
</script>
</body>
</html>
