
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 동아리 축제 관리자</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  text-align: center;
  padding: 20px;
}
.card {
  max-width: 430px;
  margin: 24px auto;
  padding: 24px;
  background: white;
  border-radius: 16px;
}
input, select, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
  border-radius: 10px;
}
input, select { border: 1px solid #ccc; }
button {
  border: none;
  background: #3858d6;
  color: white;
  cursor: pointer;
}
.secondary { background: #e8ebf4; color: #333; }
#reader { width: 100%; margin: 15px 0; }
#qrValue { overflow-wrap: anywhere; }
#loginMessage { color: #b42318; }
</style>
</head>

<body>

<div class="card" id="loginPage">
  <h2>2026 동아리 축제</h2>
  <h3>관리자 로그인</h3>

  <label for="club">동아리 선택</label>
  <select id="club">
    <option value="club01">NBRC</option>
  </select>

  <p>※ 초기 연결 테스트용 이메일 입력</p>
  <input id="email" type="email"
         placeholder="등록한 테스트 이메일"
         autocomplete="username">

  <input id="adminCode" type="password"
         placeholder="관리자 코드"
         autocomplete="current-password">

  <button id="loginBtn">관리자 로그인</button>
  <p id="loginMessage"></p>
</div>

<div class="card" id="managerPage" hidden>
  <h2 id="managerTitle">관리자 페이지</h2>
  <p>로그인 및 동아리 권한 확인 완료</p>



  <div style="background:#f4f6fb; padding:20px; border-radius:12px; margin:20px 0;">
  <h3>현재 부스 인원</h3>
  <p style="font-size:40px; font-weight:bold; margin:10px 0;">
    <span id="currentCount">-</span>명
  </p>
  <p id="countStatus" style="font-size:13px; color:#777;">
    인원 정보 불러오는 중...
  </p>
</div>
  <h3>학생 QR 스캐너</h3>
  <button id="startBtn">QR 스캔 시작</button>
  <div id="reader"></div>
  <p id="status">스캔 대기 중</p>

  <div id="result" hidden>
    <strong>QR 인식 성공!</strong>
    <p id="qrValue"></p>
  </div>

  <button class="secondary" id="stopBtn">스캔 종료</button>
  <button class="secondary" id="logoutBtn">로그아웃</button>

  <p style="color:#777;font-size:13px">
    현재는 로그인·QR 인식 테스트 단계입니다.
    실제 입퇴장 기록은 아직 저장하지 않습니다.
  </p>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC2VNRvtLdE6DZQjVo3MSdyDigU8s99rI0",
  authDomain: "festival-booth-manager-da0de.firebaseapp.com",
  projectId: "festival-booth-manager-da0de",
  storageBucket: "festival-booth-manager-da0de.firebasestorage.app",
  messagingSenderId: "18896020742",
  appId: "1:18896020742:web:a0f3e5f89a4c40308aea87"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const el = id => document.getElementById(id);

let scanner = null;
let running = false;
let busy = false;
let authorizedClub = null;

let unsubscribeCount = null;

function watchBoothCount(clubId) {
  // 기존 연결이 있으면 해제
  if (unsubscribeCount) {
    unsubscribeCount();
    unsubscribeCount = null;
  }

  el("currentCount").textContent = "-";
  el("countStatus").textContent = "인원 정보 불러오는 중...";

  const boothRef = doc(db, "booths", clubId);

  unsubscribeCount = onSnapshot(
    boothRef,
    snapshot => {
      if (!snapshot.exists()) {
        el("countStatus").textContent =
          "부스 데이터를 찾을 수 없습니다.";
        return;
      }

      const count = snapshot.data().currentCount;

      el("currentCount").textContent = count;
      el("countStatus").textContent =
        "실시간 연결 중";
    },
    error => {
      console.error(error);
      el("countStatus").textContent =
        "인원 조회 오류: " + error.message;
    }
  );
}

async function checkAccess(user) {
  const snap = await getDoc(doc(db, "admins", user.uid));
  if (!snap.exists()) {
    throw new Error("관리자 권한 정보가 없습니다.");
  }
  const clubId = snap.data().clubId;
  if (clubId !== "club01") {
    throw new Error("NBRC 관리자 권한이 없습니다.");
  }
  return clubId;
}

async function showAuthorizedPage(user) {
  authorizedClub = await checkAccess(user);
  el("loginPage").hidden = true;
  el("managerPage").hidden = false;
  el("managerTitle").textContent = "NBRC 관리자 페이지";
  watchBoothCount(authorizedClub);
}

el("loginBtn").addEventListener("click", async () => {
  const email = el("email").value.trim();
  const password = el("adminCode").value;
  const selectedClub = el("club").value;

  el("loginMessage").textContent = "로그인 확인 중...";

  try {
    if (!email || !password) {
      throw new Error("이메일과 관리자 코드를 입력해 주세요.");
    }

    const credential = await signInWithEmailAndPassword(
      auth, email, password
    );

    const clubId = await checkAccess(credential.user);

    if (clubId !== selectedClub) {
      throw new Error("선택한 동아리와 관리자 계정이 다릅니다.");
    }

    await showAuthorizedPage(credential.user);
    el("loginMessage").textContent = "";
    el("adminCode").value = "";
  } catch (error) {
    await signOut(auth);
    el("loginMessage").textContent =
      "로그인 실패: " + error.message;
  }
});

onAuthStateChanged(auth, async user => {
  if (!user) {
  if (unsubscribeCount) {
    unsubscribeCount();
    unsubscribeCount = null;
  }

  authorizedClub = null;
    el("loginPage").hidden = false;
    el("managerPage").hidden = true;
    return;
  }

  try {
    await showAuthorizedPage(user);
  } catch (error) {
    await signOut(auth);
    el("loginMessage").textContent = error.message;
  }
});

async function startScan() {
  if (running || busy || authorizedClub !== "club01") return;
  busy = true;

  try {
    if (!scanner) scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      async decodedText => {
        el("qrValue").textContent = decodedText;
        el("result").hidden = false;
        el("status").textContent = "QR 인식 성공";
        await stopScan();
      },
      () => {}
    );

    running = true;
    el("status").textContent = "학생 QR을 비춰 주세요.";
  } catch (error) {
    el("status").textContent = "카메라 오류: " + error.message;
  } finally {
    busy = false;
  }
}

async function stopScan() {
  if (scanner && running) {
    running = false;
    try { await scanner.stop(); } catch (error) {
      console.error(error);
    }
  }
}

el("startBtn").addEventListener("click", startScan);
el("stopBtn").addEventListener("click", stopScan);

el("logoutBtn").addEventListener("click", async () => {
  await stopScan();
  await signOut(auth);
});
</script>
</body>
</html>
