
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>동아리 QR 스캐너</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 font-family:Arial,sans-serif;
 background:#f4f6fb;
 padding:20px;
 text-align:center;
}
.card{
 background:white;
 max-width:420px;
 margin:25px auto;
 padding:24px;
 border-radius:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:10px;
 background:#3858d6;
 color:white;
 font-size:16px;
}
.secondary{background:#e8ebf4;color:#333}
#reader{width:100%;margin-top:15px}
#result{
 background:#e9f8ef;
 padding:14px;
 border-radius:10px;
 margin-top:15px;
 overflow-wrap:anywhere;
}
</style>
</head>
<body>
<div class="card">
<h2>2026 동아리 축제</h2>
<h3>학생 QR 스캐너</h3>

<button id="startBtn" onclick="startScan()">
QR 스캔 시작
</button>

<div id="reader"></div>
<p id="status">스캔 대기 중</p>

<div id="result" hidden>
<strong>QR 인식 성공!</strong>
<p id="qrValue"></p>
</div>

<button class="secondary" onclick="stopScan()">
스캔 종료
</button>
</div>

<script>
let scanner=null;
let running=false;
let processing=false;

async function startScan(){
 if(running)return;
 const status=document.getElementById('status');

 if(typeof Html5Qrcode==='undefined'){
  status.textContent='QR 라이브러리를 불러오지 못했습니다.';
  return;
 }

 try{
  if(!scanner)scanner=new Html5Qrcode('reader');

  await scanner.start(
   {facingMode:'environment'},
   {fps:10,qrbox:{width:220,height:220}},
   async function(decodedText){
    if(processing)return;
    processing=true;

    document.getElementById('qrValue')
      .textContent=decodedText;
    document.getElementById('result').hidden=false;
    status.textContent='QR 인식 완료';

    await stopScan();
   },
   function(){}
  );

  running=true;
  status.textContent='QR코드를 카메라에 비춰 주세요.';
 }catch(e){
  status.textContent='카메라 오류: '+e.message;
 }
}

async function stopScan(){
 if(scanner&&running){
  try{
   await scanner.stop();
  }catch(e){
   console.error(e);
  }
 }
 running=false;
 processing=false;
}
</script>
</body>
</html>
