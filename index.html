
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2026 대전노은고등학교 동아리 발표회 관리자</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: #f4f6fb;
  font-family: Arial, sans-serif;
  color: #222;
  text-align: center;
}

.card {
  max-width: 450px;
  margin: 22px auto;
  padding: 24px;
  background: white;
  border-radius: 16px;
}

h1 {
  font-size: 23px;
  line-height: 1.5;
}

h2 {
  font-size: 21px;
}

label {
  display: block;
  margin: 16px 0 7px;
  font-weight: bold;
  text-align: left;
}

input, select, button {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border-radius: 10px;
  font-size: 16px;
}

input, select {
  border: 1px solid #ccc;
  background: white;
}

button {
  background: #3858d6;
  color: white;
  border: none;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
}

.secondary {
  background: #e8ebf4;
  color: #333;
}

.box {
  padding: 20px;
  margin: 20px 0;
  border-radius: 12px;
  background: #f4f6fb;
}

.count {
  font-size: 44px;
  font-weight: bold;
  margin: 10px 0;
}

.small {
  color: #777;
  font-size: 13px;
  line-height: 1.6;
}

.error {
  color: #b42318;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#reader {
  width: 100%;
  margin: 15px 0;
}

#studentResult {
  background: #eef5ff;
  border-radius: 12px;
  padding: 16px;
  margin: 15px 0;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<!-- 관리자 로그인 -->

<div class="card" id="loginPage">

  <h1>
    2026 대전노은고등학교<br>
    동아리 발표회
  </h1>

  <h2>부스 관리자</h2>

  <label for="club">동아리 선택</label>
  <select id="club"></select>

  <label for="email">관리자 이메일</label>
  <input
    id="email"
    type="email"
    placeholder="등록된 관리자 이메일"
    autocomplete="username"
  >

  <label for="adminCode">관리자 코드</label>
  <input
    id="adminCode"
    type="password"
    placeholder="관리자 코드 입력"
    autocomplete="current-password"
  >

  <button id="loginBtn">
    로그인
  </button>

  <p id="loginMessage" class="error"></p>

  <p class="small">
    현재 Firebase에 등록된 관리자 계정만
    로그인할 수 있습니다.
  </p>

</div>


<!-- 관리자 페이지 -->

<div class="card" id="managerPage" hidden>

  <h2 id="managerTitle">
    동아리 관리자
  </h2>

  <p class="small">
    관리자 인증 완료
  </p>

  <!-- 현재 부스 인원 -->

  <div class="box">

    <h3>현재 부스 인원</h3>

    <p class="count">
      <span id="currentCount">-</span>명
    </p>

    <p id="countStatus" class="small">
      인원 정보 불러오는 중...
    </p>

  </div>


  <!-- 학생 QR -->

  <h3>학생 QR 스캐너</h3>

  <button id="startBtn">
    QR 스캔 시작
  </button>

  <div id="reader"></div>

  <p id="scanStatus">
    스캔 대기 중
  </p>


  <!-- QR 조회 결과 -->

  <div id="studentResult" hidden>

    <h3>학생 QR 확인 결과</h3>

    <p id="studentStatus"></p>

    <p id="studentClub"></p>

  </div>


  <button id="stopBtn" class="secondary">
    스캔 종료
  </button>

  <button id="logoutBtn" class="secondary">
    로그아웃
  </button>

  <p class="small">
    현재 버전은 QR 확인 및 실시간 인원 조회용입니다.
    실제 입·퇴장 기록은 아직 변경하지 않습니다.
  </p>

</div>


<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";


// Firebase 설정

const firebaseConfig = {
  apiKey: "AIzaSyC2VNRvtLdE6DZQjVo3MSdyDigU8s99rI0",
  authDomain: "festival-booth-manager-da0de.firebaseapp.com",
  projectId: "festival-booth-manager-da0de",
  storageBucket: "festival-booth-manager-da0de.firebasestorage.app",
  messagingSenderId: "18896020742",
  appId: "1:18896020742:web:a0f3e5f89a4c40308aea87"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const el = id => document.getElementById(id);


// 공식 동아리 26개

const CLUB_NAMES = [

  "Chem Is Try",
  "Clavis",
  "D.P.",
  "E.P.C.",
  "INNOBIZ",
  "IVECA",
  "L.I.G.",
  "Mechanic",
  "M.V.P",
  "NBRC",
  "NEBS",
  "Nurse I Am",
  "Polaris",
  "S.I.S.",
  "T.L.",
  "뉴턴",
  "디오니소스",
  "미토피아",
  "심장",
  "온본디",
  "이슈있슈",
  "인문이문",
  "일본문화탐구동아리",
  "창공",
  "축구부",
  "크레센도"

];

const CLUBS = CLUB_NAMES.map((name, index) => ({
  id: "club" + String(index + 1).padStart(2, "0"),
  name: name
}));

const clubMap = new Map(
  CLUBS.map(club => [club.id, club.name])
);


// 동아리 선택 목록

CLUBS.forEach(club => {

  const option = document.createElement("option");

  option.value = club.id;
  option.textContent = club.name;

  el("club").appendChild(option);

});


// 현재 상태

let authorizedClub = null;
let unsubscribeCount = null;

let scanner = null;
let running = false;
let starting = false;
let processingQr = false;


// 관리자 권한 확인

async function checkAccess(user) {

  const snapshot = await getDoc(
    doc(db, "admins", user.uid)
  );

  if (!snapshot.exists()) {
    throw new Error("관리자 권한 정보가 없습니다.");
  }

  const clubId = snapshot.data().clubId;

  if (!clubMap.has(clubId)) {
    throw new Error("등록되지 않은 동아리 권한입니다.");
  }

  return clubId;

}


// 부스 인원 실시간 조회

function watchBoothCount(clubId) {

  if (unsubscribeCount) {
    unsubscribeCount();
    unsubscribeCount = null;
  }

  el("currentCount").textContent = "-";
  el("countStatus").textContent = "인원 조회 중...";

  unsubscribeCount = onSnapshot(

    doc(db, "booths", clubId),

    snapshot => {

      if (!snapshot.exists()) {
        el("countStatus").textContent =
          "부스 데이터가 없습니다.";
        return;
      }

      const data = snapshot.data();

      el("currentCount").textContent =
        data.currentCount ?? 0;

      el("countStatus").textContent =
        "실시간 연결 중";

    },

    error => {

      console.error(error);

      el("countStatus").textContent =
        "조회 오류: " + error.message;

    }

  );

}


// 관리자 화면 표시

async function showManager(user) {

  const clubId = await checkAccess(user);

  authorizedClub = clubId;

  el("club").value = clubId;

  el("managerTitle").textContent =
    clubMap.get(clubId) + " 관리자";

  el("loginPage").hidden = true;
  el("managerPage").hidden = false;

  watchBoothCount(clubId);

}


// 로그인

el("loginBtn").addEventListener("click", async () => {

  const selectedClub = el("club").value;
  const email = el("email").value.trim();
  const password = el("adminCode").value;

  el("loginMessage").textContent = "";

  if (!email || !password) {

    el("loginMessage").textContent =
      "이메일과 관리자 코드를 입력해 주세요.";

    return;
  }

  el("loginBtn").disabled = true;

  try {

    const credential =
      await signInWithEmailAndPassword(
        auth, email, password
      );

    const clubId =
      await checkAccess(credential.user);

    if (clubId !== selectedClub) {

      throw new Error(
        "선택한 동아리와 관리자 계정이 일치하지 않습니다."
      );

    }

    await showManager(credential.user);

    el("adminCode").value = "";

  } catch (error) {

    await signOut(auth);

    el("loginMessage").textContent =
      "로그인 실패: " + error.message;

  } finally {

    el("loginBtn").disabled = false;

  }

});


// 로그인 상태 유지

onAuthStateChanged(auth, async user => {

  if (!user) {

    authorizedClub = null;

    if (unsubscribeCount) {
      unsubscribeCount();
      unsubscribeCount = null;
    }

    await stopScan();

    el("loginPage").hidden = false;
    el("managerPage").hidden = true;

    return;
  }

  try {

    await showManager(user);

  } catch (error) {

    await signOut(auth);

    el("loginMessage").textContent =
      error.message;

  }

});


// 학생 QR 조회

async function checkStudentQr(decodedText) {

  const token = String(decodedText || "").trim();

  el("studentStatus").textContent =
    "학생 정보 확인 중...";

  el("studentClub").textContent = "";

  if (!/^[a-f0-9]{64}$/i.test(token)) {

    el("studentStatus").textContent =
      "올바른 QR 형식이 아닙니다.";

    return;
  }

  try {

    const snapshot = await getDoc(
      doc(db, "students", token)
    );

    if (!snapshot.exists()) {

      el("studentStatus").textContent =
        "등록되지 않은 QR입니다.";

      return;
    }

    const currentClubId =
      snapshot.data().currentClubId || "";

    el("studentStatus").textContent =
      "등록된 학생 QR입니다!";

    if (!currentClubId) {

      el("studentClub").textContent =
        "현재 상태: 미입장";

    } else if (currentClubId === authorizedClub) {

      el("studentClub").textContent =
        "현재 상태: 이 부스에 입장 중";

    } else {

      const name =
        clubMap.get(currentClubId) || "다른 동아리";

      el("studentClub").textContent =
        "현재 상태: " + name + " 입장 중";

    }

  } catch (error) {

    console.error(error);

    el("studentStatus").textContent =
      "학생 조회 실패";

    el("studentClub").textContent =
      error.message;

  }

}


// QR 스캔 시작

async function startScan() {

  if (
    running ||
    starting ||
    processingQr ||
    !authorizedClub
  ) return;

  starting = true;

  el("studentResult").hidden = true;

  try {

    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: { width: 220, height: 220 }
      },

      async decodedText => {

        if (processingQr) return;

        processingQr = true;

        el("studentResult").hidden = false;

        el("scanStatus").textContent =
          "QR 확인 중...";

        try {

          await stopScan();

          await checkStudentQr(decodedText);

          el("scanStatus").textContent =
            "QR 확인 완료";

        } catch (error) {

          console.error(error);

          el("scanStatus").textContent =
            "QR 확인 실패";

        } finally {

          processingQr = false;

        }

      },

      () => {}

    );

    running = true;

    el("scanStatus").textContent =
      "학생 QR을 비춰 주세요.";

  } catch (error) {

    el("scanStatus").textContent =
      "카메라 오류: " + error.message;

  } finally {

    starting = false;

  }

}


// QR 스캔 중지

async function stopScan() {

  if (scanner && running) {

    running = false;

    try {
      await scanner.stop();
    } catch (error) {
      console.error(error);
    }

  }

}


// 버튼 연결

el("startBtn").addEventListener(
  "click", startScan
);

el("stopBtn").addEventListener(
  "click", stopScan
);

el("logoutBtn").addEventListener(
  "click", async () => {

    await stopScan();
    await signOut(auth);

  }
);

</script>
</body>
</html>
