
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>2026 동아리 발표회 QR 스캐너</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
      text-align: center;
    }

    .card {
      max-width: 440px;
      margin: 24px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0000000b;
    }

    h1 {
      font-size: 22px;
      line-height: 1.5;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: none;
      border-radius: 10px;
      background: #3858d6;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    .secondary {
      background: #e8ebf4;
      color: #333;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
    }

    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #f4f6fb;
      line-height: 1.7;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .success {
      background: #e9f8ed !important;
      color: #166534;
    }

    .error {
      background: #fef0ef !important;
      color: #b42318;
    }

    .small {
      font-size: 13px;
      color: #777;
      line-height: 1.6;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>
    2026 대전노은고등학교<br>
    동아리 발표회
  </h1>

  <h2>학생 QR 스캐너</h2>

  <p class="small">
    카메라를 켜고 QR 코드를 비춰 주세요.
  </p>

  <button id="startBtn">
    카메라 켜기
  </button>

  <button
    id="stopBtn"
    class="secondary"
    hidden
  >
    카메라 끄기
  </button>

  <div id="reader"></div>

  <div id="result" aria-live="polite">
    스캔 대기 중
  </div>

  <p class="small">
    현재는 카메라와 QR 인식 기능만 점검합니다.
    학생 정보 조회 및 입·퇴장은 처리하지 않습니다.
  </p>

</div>

<script>
  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  const result =
    document.getElementById("result");

  let scanner = null;
  let starting = false;
  let lastScanTime = 0;

  function showMessage(message, type = "") {
    result.textContent = message;
    result.className = type;
  }

  async function startScanner() {

    if (scanner || starting) return;

    if (typeof Html5Qrcode === "undefined") {
      showMessage(
        "QR 라이브러리를 불러오지 못했습니다.",
        "error"
      );
      return;
    }

    starting = true;
    startBtn.disabled = true;

    const instance = new Html5Qrcode("reader");
    scanner = instance;

    try {

      await instance.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: {
            width: 220,
            height: 220
          }
        },
        onScanSuccess,
        () => {}
      );

      startBtn.hidden = true;
      stopBtn.hidden = false;

      showMessage(
        "카메라 실행 완료!\nQR 코드를 비춰 주세요."
      );

    } catch (error) {

      scanner = null;

      showMessage(
        "카메라 실행 실패: " +
        (error.message || String(error)),
        "error"
      );

      try {
        instance.clear();
      } catch (e) {
        console.error(e);
      }

    } finally {
      starting = false;
      startBtn.disabled = false;
    }
  }

  async function stopScanner() {

    if (!scanner) return;

    const instance = scanner;
    scanner = null;

    try {

      if (instance.isScanning) {
        await instance.stop();
      }

      instance.clear();

    } catch (error) {
      console.error(error);
    }

    startBtn.hidden = false;
    stopBtn.hidden = true;
  }

  function onScanSuccess(decodedText) {

    const now = Date.now();

    if (now - lastScanTime < 3000) {
      return;
    }

    lastScanTime = now;

    // QR식별값은 화면에 표시하거나 저장하지 않음
    if (/^[a-fA-F0-9]{64}$/.test(decodedText.trim())) {

      showMessage(
        "✓ QR 인식 성공!\n64자리 학생 QR 형식 확인 완료\n\n아직 Firebase 조회나 입·퇴장은 처리하지 않았습니다.",
        "success"
      );

    } else {

      showMessage(
        "QR은 인식했지만 학생 QR 형식이 아닙니다.",
        "error"
      );

    }
  }

  startBtn.addEventListener(
    "click",
    startScanner
  );

  stopBtn.addEventListener(
    "click",
    stopScanner
  );
</script>

</body>
</html>
